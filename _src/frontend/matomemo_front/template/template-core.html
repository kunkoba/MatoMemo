<!-- 【ダイアログ親】フレーム -->

<!-- 【ダイアログ子】Atmosphere設定ダイアログ（完全高さ同調版） -->
<template id="tpl-setting-weather">
    <div class="w-full text-slate-900 space-y-6 px-1 py-1">
        <!-- 1. 天候選択ボタン（上部） -->
        <div class="w-full">
            <div id="atm-weather-group" class="grid grid-cols-3 gap-2">
                <button data-val="0" class="atm-w-btn h-11 border-2 border-red-100 bg-white text-red-500 font-bold text-[0.9rem] rounded-xl active:scale-95 transition-all">クリア</button>
                <button data-val="1" class="atm-w-btn h-11 border-2 border-brand-2 bg-white text-brand-5 font-bold text-[0.9rem] rounded-xl active:scale-95 transition-all">葉っぱ</button>
                <button data-val="2" class="atm-w-btn h-11 border-2 border-brand-2 bg-white text-brand-5 font-bold text-[0.9rem] rounded-xl active:scale-95 transition-all">雨</button>
                <button data-val="3" class="atm-w-btn h-11 border-2 border-brand-2 bg-white text-brand-5 font-bold text-[0.9rem] rounded-xl active:scale-95 transition-all">雷雨</button>
                <button data-val="4" class="atm-w-btn h-11 border-2 border-brand-2 bg-white text-brand-5 font-bold text-[0.9rem] rounded-xl active:scale-95 transition-all">雪</button>
                <button data-val="5" class="atm-w-btn h-11 border-2 border-brand-2 bg-white text-brand-5 font-bold text-[0.9rem] rounded-xl active:scale-95 transition-all">桜</button>
            </div>
        </div>
        <!-- 2. 設定エリア（垂直並び） -->
        <div class="flex flex-col gap-2">
            <!-- WIND -->
            <div class="bg-white p-2">
                <label class="block font-bold text-slate-600 text-[0.9rem] uppercase tracking-widest mb-1 pl-1">風速</label>
                <div class="flex items-center gap-4">
                    <span id="atm-wind-val" class="w-8 text-[1.5rem] font-bold text-brand-5 text-center italic">0</span>
                    <input id="atm-wind" type="range" min="0" max="9" value="0" class="flex-1 h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-brand-5">
                    <div class="flex gap-2 shrink-0">
                        <button id="btn-wind-minus" class="w-12 h-12 rounded-xl bg-slate-100 border  flex items-center justify-center text-slate-600 text-[1.5rem] font-bold active:scale-90 ">-</button>
                        <button id="btn-wind-plus"  class="w-12 h-12 rounded-xl bg-brand-5 border border-brand-4 flex items-center justify-center text-white text-[1.5rem] font-bold active:scale-90 shadow-md">+</button>
                    </div>
                </div>
            </div>
            <!-- DENSITY -->
            <div class="bg-white p-2">
                <label class="block font-bold text-slate-600 text-[0.9rem] uppercase tracking-widest mb-1 pl-1">粒度</label>
                <div class="flex items-center gap-4">
                    <span id="atm-density-val" class="w-8 text-[1.5rem] font-bold text-brand-5 text-center italic">0</span>
                    <input id="atm-density" type="range" min="0" max="9" value="0" class="flex-1 h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-brand-5">
                    <div class="flex gap-2 shrink-0">
                        <button id="btn-density-minus" class="w-12 h-12 rounded-xl bg-slate-100 border  flex items-center justify-center text-slate-600 text-[1.5rem] font-bold active:scale-90 ">-</button>
                        <button id="btn-density-plus"  class="w-12 h-12 rounded-xl bg-brand-5 border border-brand-4 flex items-center justify-center text-white text-[1.5rem] font-bold active:scale-90 shadow-md">+</button>
                    </div>
                </div>
            </div>
            <!-- DARK -->
            <div class="bg-white p-2">
                <label class="block font-bold text-slate-600 text-[0.9rem] uppercase tracking-widest mb-1 pl-1">暗さ</label>
                <div class="flex items-center gap-4">
                    <span id="atm-darkness-val" class="w-8 text-[1.5rem] font-bold text-brand-5 text-center italic">0</span>
                    <input id="atm-darkness" type="range" min="0" max="9" value="0" class="flex-1 h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-brand-5">
                    <div class="flex gap-2 shrink-0">
                        <button id="btn-dark-minus" class="w-12 h-12 rounded-xl bg-slate-100 border  flex items-center justify-center text-slate-600 text-[1.5rem] font-bold active:scale-90 ">-</button>
                        <button id="btn-dark-plus"  class="w-12 h-12 rounded-xl bg-brand-5 border border-brand-4 flex items-center justify-center text-white text-[1.5rem] font-bold active:scale-90 shadow-md">+</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- 3. 下部：コード（非表示でも良いが、デバッグ用に最小化して残す） -->
        <div class="flex justify-center border-t border-slate-50 pt-4">
            <span id="atm-code-preview" class="text-[1.2rem] font-bold text-slate-600 tracking-[0.5em]">0000</span>
        </div>
    </div>
</template>
