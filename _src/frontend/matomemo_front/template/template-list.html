<!-- 【リスト親】フレーム -->
<template id="tpl-list-parent">
    <div class="w-full text-slate-600"></div>
</template>

<!-- 【リスト親】グループヘッダー -->
<template id="tpl-list-group-header">
    <div class="flex items-center gap-2 mt-6 mb-4">
        <div class="px-3 py-1 rounded-full text-[0.9rem] font-bold text-white flex items-center gap-1.5 shadow-md js-header-badge">
            <span class="js-header-icon text-[0.9rem]"></span>
            <span class="js-header-title uppercase tracking-widest"></span>
        </div>
        <div class="flex-1 h-px bg-brand-2"></div>
    </div>
</template>

<!-- 【リスト親】タイムラインコンテナ -->
<template id="tpl-timeline-container">
    <div class="relative w-full text-slate-600 mb-2 px-1">
        <div class="absolute left-[22px] top-0 bottom-0 w-px bg-slate-200 z-0"></div>
        <div class="js-list-container relative z-10 space-y-4"></div>
    </div>
</template>

<!-- 【リスト子】タイムライン日付 -->
<template id="tpl-timeline-date">
    <div class="flex items-center gap-3 pt-2 cursor-pointer opacity-90">
        <!-- ここに $UI.Generator.MemoDateFormatter で生成したオブジェクトを appendChild する -->
        <div class="js-date-container flex items-center"></div>
        <!-- 横線：バッジの高さに合わせて位置を微調整 -->
        <div class="flex-1 h-[1px] bg-slate-100 mt-1"></div>
    </div>
</template>

<!-- 【リスト子】タイムラインアイテム -->
<template id="tpl-timeline-item">
    <div class="relative flex items-stretch gap-2 group cursor-pointer active:scale-[0.98] transition-transform mb-2 mt-1">
        <div class="shrink-0 w-10 flex flex-col items-center pt-2 z-10">
            <div class="js-face kb-icon-emoji-lg mb-3"></div>
            <div class="text-[0.9rem] font-bold text-slate-900 js-time tracking-wider bg-brand-0 px-1"></div>
        </div>
        <div class="ml-2 w-full bg-white relative overflow-hidden flex flex-col items-end gap-2">
            <!-- 右上アクショングループ（絶対配置で一括管理） -->
            <div class="_absolute top-2 right-2 flex items-center _justify-end gap-4 z-20">
                <!-- 削除ボタン（順序：左） -->
                <button class="js-btn-detach hidden w-7 h-7 bg-white text-slate-600 flex items-center justify-center hover:bg-slate-100 active:scale-95 transition-all text-[0.9rem]">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#000000"><path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/></svg>
                </button>
                <!-- Feelアイコン（順序：中央） -->
                <img src="" class="js-feel-image hidden w-8 h-8 object-contain">
                <!-- 番号バッジ（順序：右） -->
                <div class="js-index-badge w-7 h-7 rounded-full bg-brand-4 text-white font-bold text-[0.9rem] flex items-center justify-center"></div>
            </div>
            <!-- タイトル -->
            <div class="border-l-4 border-brand-3 pl-2 py-2 w-full">
                <div class="js-title text-[1rem] font-bold text-slate-900 break-words"></div>
            </div>
            <!-- 金額 -->
            <div class="js-price-wrapper pl-3 flex items-baseline italic w-full hidden"><span class="js-price text-[1rem] font-bold italic "></span><span class="js-price-unit text-[0.9rem] font-bold text-slate-600 ml-1.5 uppercase"></span></div>
            <!-- 本文 -->
            <div class="js-body text-[0.9rem] text-slate-900 whitespace-pre-wrap break-words w-full leading-[1.8] mb-4"></div>
        </div>
    </div>
</template>

<!-- 【リスト子】シンプルリスト（検索結果・単発リスト用） -->
<template id="tpl-list-child-search">
    <div class="js-item-card relative flex flex-col p-4 border-b _rounded-[1rem] _border _ _shadow-md bg-white cursor-pointer active:scale-[0.98] transition-transform overflow-hidden mb-3">
        <div class="flex justify-between items-center mb-2">
            <div class="flex items-center gap-2">
                <span class="js-index w-6 h-6 bg-slate-800 text-white text-[0.9rem] font-bold rounded-full flex items-center justify-center"></span>
                <!-- 【変更】作成日時表示用spanをコンテナに変更 -->
                <div class="js-date-container"></div>
            </div>
            <div class="js-face shrink-0 kb-icon-emoji-lg "></div>
        </div>
        <!-- 2. 所属まとめタイトル -->
        <div class="flex items-center gap-1.5 mb-1.5">
            <span class="kb-icon-emoji-sm">🗂️</span>
            <span class="js-archive-title text-[0.9rem] font-bold text-brand-5 truncate"></span>
        </div>
        <!-- 3. 地点タイトル -->
        <div class="js-title text-[1rem] font-bold text-slate-900 truncate mb-1"></div>
        <!-- 4. 本文 (2行まで許容) -->
        <div class="js-body text-[0.9rem] text-slate-600 line-clamp-2  mb-3"></div>
    </div>
</template>

<!-- 【リスト子】まとめ親一覧 -->
<template id="tpl-list-child-archive">
    <div class="js-item-card relative bg-white border-b mb-6 overflow-hidden cursor-pointer active:scale-[0.98] transition-transform">
        <div class="js-item-border absolute left-0 top-0 bottom-0 w-1"></div>
        <div class="p-3 pl-4 flex flex-col gap-1">
            <div class="flex justify-between items-start mb-1">
                <!-- 左：日付のみ -->
                <span class="js-update-tim kb-date-tim-sm"></span>
                <!-- 右：件数バッジ（背景色はJSで設定） -->
                <div class="js-count-badge px-2.5 py-0.5 rounded-full text-[0.9rem] font-bold text-white italic tracking-tight">
                    <span class="js-count">0</span>
                </div>
            </div>
            <div class="js-title text-[0.9rem] font-bold text-slate-900 truncate mb-1"></div>
            <div class="js-memo text-[0.9rem] text-slate-600 line-clamp-1"></div>
        </div>
    </div>
</template>

<!-- 【リスト子】マルチセレクト用 -->
<template id="tpl-multi-select-date">
    <div class="flex items-center gap-3 p-3 cursor-pointer active:opacity-50">
        <!-- 部品注入用コンテナ（クラス名は維持） -->
        <div class="js-date-text"></div>
        <div class="flex-1 h-[1px] bg-brand-2"></div>
    </div>
</template>
<!-- 【リスト子】マルチセレクト用 -->
<template id="tpl-multi-select-item">
    <div class="js-item-card flex items-center gap-3 p-2.5 rounded-[1rem] border border-brand-2 bg-white cursor-pointer active:scale-[0.98] transition-all shadow-md mb-2">
        <div class="shrink-0 w-5 h-5 rounded border border-brand-3 flex items-center justify-center js-checkbox transition-colors">
            <span class="text-white text-[0.9rem] font-bold js-check-mark hidden">✓</span>
        </div>
        <div class="flex-1 min-w-0">
            <div class="flex items-baseline gap-2"><span class="shrink-0 text-[0.9rem] font-bold text-slate-600 js-time"></span><span class="flex-1 text-[0.9rem] font-bold text-slate-900 truncate js-title"></span></div>
            <div class="text-[0.9rem] text-slate-600 line-clamp-1 mt-0.5 js-body"></div>
        </div>
        <div class="shrink-0 ml-1 js-emoji kb-icon-emoji-lg"></div>
    </div>
</template>

<!-- 【リスト子】通知一覧用 -->
<template id="tpl-list-child-notice">
    <!-- 枠線と影はJSで動的に付けるため、最低限のレイアウトクラスのみ残す -->
    <div class="js-item-card flex p-4 cursor-pointer active:scale-[0.98] transition-all overflow-hidden mb-3 relative border-2">
        <!-- 右上の固定アイコンエリア -->
        <div class="absolute top-2 right-2 flex flex-col items-end gap-1 z-10">
            <span class="js-icon kb-icon-emoji-lg"></span>
        </div>
        <!-- テキストエリア -->
        <div class="flex-1 min-w-0 pr-4 flex flex-col justify-center">
            <div>
                <span class="js-date kb-date-tim-sm"></span>
                <span class="hidden ml-3 js-badge-new bg-red-500 text-white text-[0.9rem] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider ">NEW</span>
            </div>
            <div class="text-[0.9rem] font-bold text-slate-900 truncate js-title mt-2"></div>
            <div class="mt-2 text-[0.9rem] text-slate-900 line-clamp-1 js-body break-words "></div>
        </div>
    </div>
</template>

<!-- 【リスト子】レビューアイテム -->
<template id="tpl-list-child-review">
    <div class="p-4 flex flex-col border-b">
        <div class="flex justify-between items-center mb-1.5">
            <div class="js-date kb-date-tim-sm"></div>
            <div class="js-stars text-[1rem] text-yellow-500 tracking-widest  drop-"></div>
        </div>
        <div class="js-body text-[0.9rem] text-slate-900  line-clamp-1 break-words"></div>
    </div>
</template>

<!-- 【リスト子】タイムライン（アイコン対応版） -->
<template id="tpl-list-child-timeline">
    <div class="flex mx-3 border-b border-brand-1 active:bg-brand-1 transition-colors">
        <!-- 左：軸 -->
        <div class="flex flex-col items-center mr-3 shrink-0">
            <div class="w-6 h-6 bg-brand-5 flex items-center justify-center js-node"></div>
            <!-- <div class="flex-1 w-[2px] bg-brand-5 js-line"></div> -->
        </div>
        <!-- 右側：内容 -->
        <div class="flex-1 min-w-0 pb-4"> <!-- ① 下余白をここへ移動 -->
            <div class="h-6 flex items-center justify-between mb-1">
                <div class="text-[0.9rem] font-bold text-brand-5 js-time"></div>
                <!-- アイコン表示エリア -->
                <div class="flex items-center gap-2">
                    <span class="js-face text-[24px] e"></span>
                    <img src="" class="js-memo-price w-6 h-6 object-contain">
                </div>
            </div>
            <div class="text-[1rem] font-bold text-slate-900 truncate js-title"></div>
            <!-- ② break-words を追加し、pb-4 を削除 -->
            <div class="text-[0.9rem] text-slate-600 line-clamp-2 js-body break-words"></div>
        </div>
    </div>
</template>

<!-- 【リスト子】ステータス情報用 -->
<template id="tpl-list-child-stats">
    <div class="js-item-card relative flex flex-col p-4 rounded-[1rem] border  bg-white mb-3 shadow-md">
        <!-- 1. 明細No、タイトル、絵文字 -->
        <div class="flex justify-between items-start mb-2">
            <div class="flex items-center gap-2">
                <span class="js-index w-6 h-6 bg-slate-800 text-white text-[0.9rem] font-bold rounded-full flex items-center justify-center shrink-0"></span>
                <div class="js-title text-[1rem] font-bold text-slate-900 truncate"></div>
            </div>
            <div class="js-face text-[1.5rem]  shrink-0"></div>
        </div>
        <!-- 2. リアクション集計 -->
        <div class="js-reaction-container flex gap-3 mb-3 bg-slate-50 p-2 rounded-lg border ">
            <!-- JSで $Const.REACTION_TYPE をループして各数値を挿入 -->
        </div>
        <!-- 3. URL、集計結果 -->
        <div class="flex justify-between items-center mt-auto pt-2 border-t ">
            <div class="flex-1 min-w-0 mr-4">
                <!-- URLが存在する場合のみ js-url-wrapper を表示 -->
                <div class="js-url-wrapper hidden text-[0.9rem] text-blue-500 italic truncate">
                    <span>🔗</span> <span class="js-url"></span>
                </div>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
                <span class="kb-icon-emoji-sm">🖱️</span>
                <span class="js-click-count text-[0.9rem] font-bold text-brand-5">0</span>
            </div>
        </div>
    </div>
</template>

<!-- 【リスト子】ユーザ解析用（クリック集計） -->
<template id="tpl-user-click-stats-item">
    <div class="bg-slate-50 rounded-[1rem] p-4 flex flex-col gap-2 border ">
        <div class="js-url text-blue-500 font-bold italic break-all text-[0.9rem] mb-1 line-clamp-1"></div>
        <div class="px-4">
            <div class="flex justify-between items-baseline">
                <span class="text-[0.9rem] text-slate-600">総クリック数</span>
                <span class="js-total text-[1rem] font-bold text-brand-5">0</span>
            </div>
            <div class="flex justify-between items-baseline">
                <span class="text-[0.9rem] text-slate-600">クリックユーザ数</span>
                <span class="js-unique text-[1rem] font-bold text-slate-700">0</span>
            </div>
            <div class="flex justify-between items-baseline">
                <span class="text-[0.9rem] text-slate-600">Guestクリック数</span>
                <span class="js-guest text-[1rem] font-bold text-slate-600">0</span>
            </div>
        </div>
    </div>
</template>
