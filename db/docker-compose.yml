name: mato-memo-compose  # ← 一番上のグループ名になります

services:
  # 3. データベース (PostgreSQL)
  db:
    image: postgres:16
    container_name: mato_memo-db
    environment:
      POSTGRES_DB: mato_memo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mato_memo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    # external: true
    name: matomemo_postgres_data

